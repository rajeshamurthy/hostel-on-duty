<!-- index.html -->
<!DOCTYPE html>
<html>
<header style="display: flex; align-items: center; padding: 10px; background-color: #f2f2f2;">
  <img src="clg-logo.jpg" alt="Sri Eshwar Logo" style="height: 80px; margin-right: 15px;">
  <div>
    <h2 style="margin: 0;">Sri Eshwar College of Engineering</h2>
    <p style="margin: 0;">Autonomous Institution | Coimbatore, Tamil Nadu</p>
  </div>
</header>
<hr>


<head>
  <title>Simulation Lab Resource Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Simulation Lab Resource Booking</h2>
    <input id="name" type="text" placeholder="Your Name" />
    <input id="regNo" type="text" placeholder="Reg. No." />
    <input id="mentor" type="text" placeholder="Mentor Name" />
    <input id="lab" type="text" placeholder="Lab Name" />
    <input id="reason" type="text" placeholder="Reason for OD" />
    <input id="date" type="date" />
    <input id="time" type="time" />
    <button onclick="bookLab()">Submit Booking</button>
    <p id="message"></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="student.js"></script>
</body>
</html>
