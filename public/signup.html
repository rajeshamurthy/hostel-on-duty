<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Hostel On-Duty Booking</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top, #1b2845 0%, #050816 55%, #02010a 100%);
      color: #e0e0ff;
    }

    body {
      display: block;
    }

    .overlay {
      width: 100%;
      min-height: 100vh;
      padding: 30px 15px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at top left, rgba(0, 212, 255, 0.15), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(100, 50, 200, 0.25), transparent 60%);
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(100, 50, 200, 0.15));
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 14px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
    }

    header img {
      height: 64px;
      margin-right: 16px;
      border-radius: 8px;
    }

    header h2 {
      margin: 0;
      color: #00d4ff;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 4px 0 0;
      color: #b0b0ff;
      font-size: 0.85rem;
    }

    .signup-container {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(100, 50, 200, 0.12));
      border: 1px solid rgba(0, 212, 255, 0.35);
      padding: 28px 24px 22px;
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
    }

    .signup-container h2 {
      text-align: center;
      margin: 0 0 6px;
      color: #00d4ff;
      font-size: 1.45rem;
      letter-spacing: 0.5px;
    }

    .signup-container p {
      text-align: center;
      color: #b0b0ff;
      margin: 0 0 18px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #b0b0ff;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: rgba(10, 16, 35, 0.9);
      color: #e0e0ff;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      font-family: 'Roboto', sans-serif;
    }

    input::placeholder {
      color: #7c7ca8;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.6);
      background: rgba(10, 20, 50, 0.95);
    }

    .username-group {
      display: flex;
      align-items: stretch;
      gap: 0;
    }

    .username-group input {
      flex: 1;
      border-radius: 10px 0 0 10px;
    }

    .username-extension {
      background: rgba(15, 22, 50, 0.95);
      border: 1px solid rgba(0, 212, 255, 0.38);
      border-left: none;
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: #9a9ad0;
      font-weight: 600;
      display: flex;
      align-items: center;
      min-width: 130px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background: linear-gradient(90deg, #00d4ff, #0099cc);
      color: #050816;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(0, 212, 255, 0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 212, 255, 0.7);
      background: linear-gradient(90deg, #00ffff, #00bbee);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 22px rgba(0, 212, 255, 0.4);
    }

    #message {
      margin-top: 12px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 8px;
      display: none;
      font-size: 0.85rem;
    }

    #message.error {
      background-color: rgba(255, 102, 102, 0.14);
      color: #ff8080;
      border: 1px solid rgba(255, 102, 102, 0.6);
      display: block;
    }

    #message.success {
      background-color: rgba(68, 255, 140, 0.14);
      color: #6dff9a;
      border: 1px solid rgba(68, 255, 140, 0.6);
      display: block;
    }

    .toggle-form {
      text-align: center;
      margin-top: 14px;
      color: #9a9ad0;
      font-size: 0.85rem;
    }

    .toggle-form a {
      color: #00d4ff;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-form a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      padding: 10px 8px;
      font-size: 0.75rem;
      color: #8888b4;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        text-align: center;
        max-width: 360px;
      }

      header img {
        margin-right: 0;
        margin-bottom: 10px;
      }

      .signup-container {
        padding: 22px 18px 18px;
      }

      .signup-container h2 {
        font-size: 1.25rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .username-group {
        flex-direction: column;
      }

      .username-group input {
        border-radius: 10px;
        margin-bottom: 8px;
      }

      .username-extension {
        width: 100%;
        border-radius: 10px;
        border-left: 1px solid rgba(0, 212, 255, 0.38);
        min-width: unset;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <header>
      <img src="clg-logo.jpg" alt="Sri Eshwar Logo">
      <div>
        <h2>Sri Eshwar College of Engineering</h2>
        <p>Autonomous Institution | Coimbatore, Tamil Nadu</p>
      </div>
    </header>

    <div class="signup-container">
      <h2>Create Student Account</h2>
      <p>Register once to access the Hostel On-Duty Portal</p>

      <form id="signupForm" onsubmit="handleSignup(event)">
        
        <!-- Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            placeholder="Enter your full name" 
            required 
          />
        </div>

        <!-- Registration / Roll Number -->
        <div class="form-group">
          <label for="rollNumber">Registration / Roll Number</label>
          <input 
            type="text" 
            id="rollNumber" 
            placeholder="e.g., 20CS001, 21ECE045" 
            required 
          />
        </div>

        <!-- Username with Extension -->
        <div class="form-group">
          <label for="username">Username</label>
          <div class="username-group">
            <input 
              type="text" 
              id="username" 
              placeholder="Enter your username" 
              required 
            />
            <div class="username-extension">@sece.ac.in</div>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter your email" 
            required 
          />
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            placeholder="Enter your phone number" 
            required 
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Password (min 6 characters)" 
            required 
          />
        </div>

        <!-- Year and Department Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="year">Year</label>
            <select id="year" required>
              <option value="">Select Year</option>
              <option value="I">I Year</option>
              <option value="II">II Year</option>
              <option value="III">III Year</option>
              <option value="IV">IV Year</option>
            </select>
          </div>

          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" required>
              <option value="">Select Department</option>
              <option value="ECE">Electronics & Communication Engineering</option>
              <option value="CSE">Computer Science & Engineering</option>
              <option value="EEE">Electrical & Electronics Engineering</option>
              <option value="MECH">Mechanical Engineering</option>
              <option value="CSE-Cybersecurity">Computer Science and Engineering (Cybersecurity)</option>
              <option value="AIDS">Artificial Intelligence & Data Science</option>
              <option value="CSE-AIML">Computer Science and Engineering (Artificial Intelligence & Machine Learning)</option>
              <option value="IT">Information Technology</option>
              <option value="CSBS">Computer Science and Business Studies</option>
            </select>
          </div>
        </div>

        <!-- Section -->
        <div class="form-group">
          <label for="section">Section</label>
          <input 
            type="text" 
            id="section" 
            placeholder="e.g., A, B, C" 
            required 
          />
        </div>

        <!-- Parent Relationship and Name Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="parentRelation">Parent Type</label>
            <select id="parentRelation" required>
              <option value="">Select Parent Type</option>
              <option value="Father">Father</option>
              <option value="Mother">Mother</option>
              <option value="Guardian">Guardian</option>
            </select>
          </div>

          <div class="form-group">
            <label for="parentName">Parent Name</label>
            <input 
              type="text" 
              id="parentName" 
              placeholder="Enter parent's name" 
              required 
            />
          </div>
        </div>

        <!-- Parent Phone Number -->
        <div class="form-group">
          <label for="parentPhone">Parent Phone Number</label>
          <input 
            type="tel" 
            id="parentPhone" 
            placeholder="Enter a parent's phone number" 
            required 
          />
        </div>

        <button type="submit">Create Account</button>
        <div id="message"></div>

        <p class="toggle-form">
          Already have an account? <a href="login.html">Sign In</a>
        </p>
      </form>
    </div>

    <footer class="footer">
      Powered by <strong>Dept. of ECE</strong>, 2026
    </footer>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  <script src="signup.js"></script>

</body>
</html>
