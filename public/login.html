<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - Hostel On-Duty Booking</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top, #1b2845 0%, #050816 55%, #02010a 100%);
      color: #e0e0ff;
    }

    body {
      display: block;
    }

    .overlay {
      width: 100%;
      min-height: 100vh;
      padding: 30px 15px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at top left, rgba(0, 212, 255, 0.15), transparent 55%),
        radial-gradient(circle at bottom right, rgba(100, 50, 200, 0.25), transparent 60%);
    }

    header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(100, 50, 200, 0.15));
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 14px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
    }

    header img {
      height: 64px;
      margin-right: 16px;
      border-radius: 8px;
    }

    header h2 {
      margin: 0;
      color: #00d4ff;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 4px 0 0;
      color: #b0b0ff;
      font-size: 0.85rem;
    }

    .login-container {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(100, 50, 200, 0.12));
      border: 1px solid rgba(0, 212, 255, 0.35);
      padding: 28px 24px 22px;
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
    }

    .login-container h2 {
      text-align: center;
      margin: 0 0 6px;
      color: #00d4ff;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .login-container p {
      text-align: center;
      color: #b0b0ff;
      margin: 0 0 18px;
      font-size: 0.9rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #b0b0ff;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: rgba(10, 16, 35, 0.9);
      color: #e0e0ff;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: #7c7ca8;
    }

    input:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.6);
      background: rgba(10, 20, 50, 0.95);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: linear-gradient(90deg, #00d4ff, #0099cc);
      color: #050816;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(0, 212, 255, 0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 212, 255, 0.7);
      background: linear-gradient(90deg, #00ffff, #00bbee);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 22px rgba(0, 212, 255, 0.4);
    }

    .role-options {
      margin: 4px 0 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(10, 18, 40, 0.9);
      border: 1px solid rgba(0, 212, 255, 0.25);
      color: #b0b0ff;
      font-size: 0.85rem;
    }

    .role-options-title {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #b0b0ff;
    }

    .role-options label {
      margin-right: 12px;
      font-size: 0.85rem;
    }

    .role-options input {
      width: auto;
      margin: 0 4px 0 0;
      box-shadow: none;
      border: none;
      background: transparent;
    }

    #message {
      margin-top: 10px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 8px;
      display: none;
      font-size: 0.85rem;
    }

    #message.error {
      background-color: rgba(255, 102, 102, 0.14);
      color: #ff8080;
      border: 1px solid rgba(255, 102, 102, 0.6);
      display: block;
    }

    #message.success {
      background-color: rgba(68, 255, 140, 0.14);
      color: #6dff9a;
      border: 1px solid rgba(68, 255, 140, 0.6);
      display: block;
    }

    .toggle-form {
      text-align: center;
      margin-top: 14px;
      color: #9a9ad0;
      font-size: 0.85rem;
    }

    .toggle-form a {
      color: #00d4ff;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-form a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      padding: 10px 8px;
      font-size: 0.75rem;
      color: #8888b4;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        text-align: center;
        max-width: 360px;
      }

      header img {
        margin-right: 0;
        margin-bottom: 10px;
      }

      .login-container {
        padding: 22px 18px 18px;
      }

      .login-container h2 {
        font-size: 1.2rem;
      }

      .role-options {
        font-size: 0.8rem;
      }

      .role-options label {
        display: inline-block;
        margin: 4px 10px 0 0;
      }
    }
  </style>
</head>

<body>

  <div class="overlay">
    <header>
      <img src="clg-logo.jpg" alt="Sri Eshwar Logo">
      <div>
        <h2>Sri Eshwar College of Engineering</h2>
        <p>Autonomous Institution | Coimbatore, Tamil Nadu</p>
      </div>
    </header>

    <div class="login-container">
      <!-- Login Form -->
      <h2>Hostel On-Duty Portal</h2>
      <p>Sign in to continue with Hostel On-Duty Portal</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <label class="form-label" for="loginEmail">Username / Email</label>
        <input type="email" id="loginEmail" placeholder="Username (without @) or Email" required />

        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required />

        <!-- Role Selection -->
        <div class="role-options">
          <span class="role-options-title">Sign in as</span>
          <label>
            <input type="radio" name="role" value="student" checked />
            Student
          </label>
          <label>
            <input type="radio" name="role" value="faculty" />
            Faculty
          </label>
          <label>
            <input type="radio" name="role" value="admin" />
            Admin
          </label>
        </div>

        <button type="submit">Sign In</button>
      </form>
      <div id="message"></div>
      <p class="toggle-form">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
      <p class="toggle-form" style="margin-top: 8px; font-size: 0.8rem;">
        <a href="create-admin.html">Create first admin account</a>
      </p>
    </div>

    <footer class="footer">
      Powered by <strong>Dept. of ECE</strong>, 2025
    </footer>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  <script src="login.js"></script>

</body>

</html>
